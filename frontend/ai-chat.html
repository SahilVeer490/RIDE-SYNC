<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RIDE SYNC AI</title>

    
    <link rel="icon" type="image/png" href="site_logo.png.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="ai-chat-container">

        <div class="ai-header">
            <h1>🤖 RIDE SYNC AI</h1>
            <p>Your AI assistant for every ride.</p>
        </div>

        <div id="chatBox" class="chat-box">
            <div class="ai-message">
                Hey rider! 👋<br>
                I'm RIDE SYNC AI. Ask me anything about bikes, rides, touring, maintenance or riding safety.
            </div>
        </div>

        <div class="chat-input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Ask about your ride..."
                autocomplete="off"
            >

            <button id="sendBtn">
                SEND
            </button>

        </div>

    </div>

    <script src="ai-chat.js"></script>

</body>
</html>
